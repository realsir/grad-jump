<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>./ GRAD JUMP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

    :root {
      --bg: #000;
      --accent: #00ff9c;
      --accent-soft: #00c27a;
      --danger: #ff4b6a;
      --bonus: #ffeb3b;
      --superjump: #ffd700;
      --shield: #3b82f6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      background: var(--bg);
      font-family: 'Orbitron', monospace;
      color: #e0e7ff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: min(900px, 98vw);
      height: 90vh;
      background: rgba(10,14,26,0.9);
      border-radius: 16px;
      border: 1px solid rgba(0,255,156,0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      box-shadow: 0 0 40px rgba(0,255,156,0.1);
    }

    .title {
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 900;
      background: linear-gradient(90deg, var(--accent), #ffeb3b);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      letter-spacing: 0.05em;
    }

    .hud {
      display: flex;
      justify-content: space-around;
      gap: 20px;
      padding: 12px;
      background: rgba(0,30,20,0.4);
      border-radius: 8px;
      border: 1px solid rgba(0,255,156,0.3);
    }

    .hud-item { text-align: center; }

    .hud-label {
      font-size: 10px;
      opacity: 0.7;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .hud-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }

    .combo { color: var(--accent-soft); animation: pulse 1s infinite; }
    .bonus-active { color: var(--bonus); animation: bonusPulse 0.8s infinite; text-shadow: 0 0 10px var(--bonus); }
    .shield-active { color: var(--shield); animation: bonusPulse 0.8s infinite; text-shadow: 0 0 10px var(--shield); }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes bonusPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes superJumpPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); box-shadow: 0 0 20px var(--superjump); } }

    .canvas-container {
      flex: 1;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(0,255,156,0.2);
      background: radial-gradient(circle at 50% 90%, #020306 0%, #000 100%);
    }

    canvas { width: 100%; height: 100%; display: block; }

    #bgCanvas {
      position: absolute;
      opacity: 0.2;
      pointer-events: none;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
    }

    .best-score {
      padding: 8px 16px;
      background: rgba(0,30,20,0.5);
      border-radius: 6px;
      border: 1px solid rgba(0,255,156,0.2);
    }

    .best-score.new {
      color: var(--accent);
      background: rgba(0,255,156,0.15);
      box-shadow: 0 0 15px rgba(0,255,156,0.3);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .btn {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--accent);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .btn:hover {
      background: rgba(0,255,156,0.1);
      box-shadow: 0 0 20px rgba(0,255,156,0.4);
      transform: translateY(-2px);
    }

    .controls + div {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 8px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .overlay.visible { display: flex; }

    .overlay-panel {
      background: rgba(10,14,26,0.95);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      max-width: 90vw;
    }

    .overlay-title {
      font-size: clamp(24px, 8vw, 32px);
      font-weight: 900;
      color: var(--accent);
      margin-bottom: 16px;
      text-shadow: 0 0 15px var(--accent);
    }

    .overlay-score {
      font-size: 20px;
      color: var(--accent-soft);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .overlay-best {
      font-size: 16px;
      color: var(--accent);
      font-weight: 900;
      margin-bottom: 20px;
      display: none;
    }

    @media (max-width: 768px) {
      .container { padding: 16px; gap: 12px; }
      .hud { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">./ GRAD JUMP</h1>

    <div class="hud">
      <div class="hud-item">
        <div class="hud-label">SCORE</div>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-item">
        <div class="hud-label">BEST</div>
        <span class="hud-value" id="bestScore">0</span>
      </div>
      <div class="hud-item">
        <div class="hud-label">COMBO</div>
        <span class="hud-value combo" id="combo">x1</span>
      </div>
      <div class="hud-item">
        <div class="hud-label">BONUS</div>
        <span class="hud-value" id="bonus">IDLE</span>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="bgCanvas" width="900" height="500"></canvas>
      <canvas id="gameCanvas" width="900" height="500"></canvas>
    </div>

    <div class="bottom">
      <div>explore ← → ...</div>
      <div class="best-score" id="bestNote">jump sir...</div>
    </div>

    <div class="controls">
      <button class="btn" id="startBtn">START</button>
      <button class="btn" id="restartBtn" style="display:none">RESTART</button>
    </div>

    <div class="overlay" id="gameOver">
      <div class="overlay-panel">
        <div class="overlay-title">GAME OVER</div>
        <div class="overlay-score">Score: <span id="finalScore">0</span></div>
        <div class="overlay-best" id="newBest">NEW BEST!</div>
        <div style="color:#94a3b8;margin:20px 0;font-size:14px">
          Side <span style="color:var(--danger)">-</span> contact or fall = death
        </div>
        <button class="btn" id="playAgain">RESTART</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const bgCanvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    const bgCtx = bgCanvas.getContext('2d');

    const W = 900, H = 500;
    canvas.width = bgCanvas.width = W;
    canvas.height = bgCanvas.height = H;

    const els = {
      score: document.getElementById('score'),
      bestScore: document.getElementById('bestScore'),
      combo: document.getElementById('combo'),
      bonus: document.getElementById('bonus'),
      bestNote: document.getElementById('bestNote'),
      startBtn: document.getElementById('startBtn'),
      restartBtn: document.getElementById('restartBtn'),
      gameOver: document.getElementById('gameOver'),
      finalScore: document.getElementById('finalScore'),
      newBest: document.getElementById('newBest'),
      playAgain: document.getElementById('playAgain')
    };

    const THRESHOLD = H * 0.4;
    const BONUS_TIME = 3000;
    const SUPER_JUMP_FORCE = 2.0;

    const SHIELD_TIME = 5000;
    const MOVING_PLATFORM_CHANCE = 0.18;

    let player = {
      x: 450, y: 350, w: 24, h: 20,
      vx: 0, vy: 0,
      speed: 3.5, jump: -12, g: 0.35,
      bonus: false, timer: 0,
      shield: false, shieldTimer: 0
    };

    let platforms = [], enemies = [], coins = [], bonuses = [], particles = [], keys = {};
    let score = 0, best = localStorage.gradJumpBest || 0, combo = 0, state = 'idle', scroll = 0, lastBonus = 0;

    els.bestScore.textContent = best;

    function makePlatform(x, y, type) {
      const w = 100 + Math.random() * 60;
      const p = { x, y, w, h: 12, type, breaking: false, breakTime: 0 };

      if (type === 'moving') {
        p.baseX = x;
        p.dir = Math.random() < 0.5 ? -1 : 1;
        p.range = 40 + Math.random() * 50;
        p.speed = 1.0 + Math.random() * 0.8;
      }
      return p;
    }

    function reset() {
      player = {
        x: 450, y: 350, w: 24, h: 20,
        vx: 0, vy: 0,
        speed: 3.5, jump: -12, g: 0.35,
        bonus: false, timer: 0,
        shield: false, shieldTimer: 0
      };

      platforms = [ { x: 400, y: H - 30, w: 100, h: 12, type: 'base' } ];
      enemies = []; coins = []; bonuses = []; particles = [];
      score = 0; combo = 0; lastBonus = 0; scroll = 0;
      state = 'running';

      for (let i = 0; i < 12; i++) {
        const x = 50 + Math.random() * (W - 150);
        const y = H - 60 - i * 55;

        const r = Math.random();
        const type = r < 0.15 ? 'super'
                   : r < 0.25 ? 'break'
                   : r < (0.25 + MOVING_PLATFORM_CHANCE) ? 'moving'
                   : 'normal';

        platforms.push(makePlatform(x, y, type));
      }

      els.gameOver.classList.remove('visible');
      els.restartBtn.style.display = 'inline-flex';
      els.startBtn.style.display = 'none';
      els.bonus.textContent = 'RUNNING';
      updateUI();
    }

    function addPlatform(x, y) {
      const r = Math.random();
      const type = r < 0.15 ? 'super'
                 : r < 0.35 ? 'break'
                 : r < (0.35 + MOVING_PLATFORM_CHANCE) ? 'moving'
                 : 'normal';

      const p = makePlatform(x, y, type);
      platforms.push(p);

      if (Math.random() < 0.4) coins.push({ x: x + p.w / 2 - 4, y: y - 18, collected: false });

      if (Math.floor(score / 100) > lastBonus && Math.random() < 0.25) {
        bonuses.push({
          x: x + p.w / 2 - 4,
          y: y - 26,
          type: Math.random() < 0.5 ? 'flight' : 'shield',
          collected: false
        });
        lastBonus = Math.floor(score / 100);
      }

      if (y < H - 120 && Math.random() < 0.25) {
        enemies.push({
          x: x + p.w / 2,
          y: y - 12,
          dir: Math.random() < 0.5 ? -1 : 1,
          speed: 0.8 + Math.random() * 0.4,
          range: 30 + Math.random() * 20,
          baseX: x + p.w / 2,
          dead: false
        });
      }
    }

    function particlesAt(x, y, c = 8, col = '#00ff9c') {
      for (let i = 0; i < c; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6 - 1,
          life: 40, maxLife: 40,
          col,
          size: 0.8 + Math.random() * 0.4
        });
      }
    }

    function superJumpEffect(x, y) {
      for (let i = 0; i < 25; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12 - 3,
          life: 60, maxLife: 60,
          col: '#ffd700'
        });
      }
    }

    function update(dt) {
      if (state !== 'running') return;

      if (player.shield) {
        player.shieldTimer -= dt;
        if (player.shieldTimer <= 0) {
          player.shield = false;
          player.shieldTimer = 0;
          particlesAt(player.x + 12, player.y, 14, '#3b82f6');
        }
      }

      if (player.bonus) {
        player.timer -= dt;
        player.vy = -8.5;
        player.vx = (keys.ArrowLeft || keys.a || keys.A ? -player.speed * 1.2 :
                    keys.ArrowRight || keys.d || keys.D ? player.speed * 1.2 : player.vx * 0.92);

        if (player.timer <= 0) {
          player.bonus = false;
          particlesAt(player.x + 12, player.y, 20, '#ffeb3b');
        }
      } else {
        player.vx = (keys.ArrowLeft || keys.a || keys.A ? -player.speed :
                    keys.ArrowRight || keys.d || keys.D ? player.speed : player.vx * 0.85);
        player.vy += player.g;
      }

      player.x += player.vx;
      player.y += player.vy;

      if (player.x + player.w < 0) player.x = W;
      if (player.x > W) player.x = -player.w;

      platforms.forEach(p => {
        if (p.type !== 'moving') return;
        p.x += p.dir * p.speed * (dt / 16);
        if (Math.abs(p.x - p.baseX) > p.range) p.dir *= -1;
      });

      player.onGround = false;
      if (player.vy > 0 && !player.bonus) {
        for (let p of platforms) {
          if (p.type === 'deleted') continue;

          if (player.x + player.w > p.x && player.x < p.x + p.w &&
              player.y + player.h > p.y && player.y + player.h < p.y + 16) {

            player.y = p.y - player.h;
            player.vy = p.type === 'super' ? player.jump * SUPER_JUMP_FORCE : player.jump;
            player.onGround = true;

            if (p.type === 'break' && !p.breaking) {
              p.breaking = true;
              particlesAt(p.x + p.w / 2, p.y + p.h, 12, '#ff9cb3');
            }

            if (p.type === 'super') {
              superJumpEffect(p.x + p.w / 2, p.y + p.h);
              score += 50;
              combo++;
            }

            break;
          }
        }
      }

      if (player.y < THRESHOLD) {
        const diff = THRESHOLD - player.y;
        player.y = THRESHOLD;
        scroll += diff;
        score += diff * 0.06;
        platforms.forEach(p => p.y += diff);
        enemies.forEach(e => e.y += diff);
        coins.forEach(c => c.y += diff);
        bonuses.forEach(b => b.y += diff);
      }

      enemies.forEach(e => {
        if (e.dead) return;
        e.x += e.dir * e.speed * (dt / 16);
        if (Math.abs(e.x - e.baseX) > e.range) e.dir *= -1;
      });

      platforms.forEach(p => {
        if (p.type === 'break' && p.breaking) {
          p.breakTime = (p.breakTime || 0) + dt;
          if (p.breakTime > 1200) {
            p.type = 'deleted';
            particlesAt(p.x + p.w / 2, p.y + p.h, 8, '#ff4b6a');
          }
        }
      });

      coins.forEach(c => {
        if (c.collected) return;
        if (player.x < c.x + 10 && player.x + player.w > c.x &&
            player.y < c.y + 10 && player.y + player.h > c.y) {
          c.collected = true;
          score += 25 * (1 + combo * 0.1);
          combo++;
          particlesAt(c.x, c.y);
        }
      });

      bonuses.forEach(b => {
        if (b.collected) return;
        if (player.x < b.x + 12 && player.x + player.w > b.x &&
            player.y < b.y + 12 && player.y + player.h > b.y) {

          b.collected = true;

          if (b.type === 'shield') {
            player.shield = true;
            player.shieldTimer = SHIELD_TIME;
            score += 80;
            combo++;
            particlesAt(b.x, b.y, 22, '#3b82f6');
          } else {
            player.bonus = true;
            player.timer = BONUS_TIME;
            score += 100;
            combo += 2;
            particlesAt(b.x, b.y, 20, '#ffeb3b');
          }
        }
      });

      enemies.forEach(e => {
        if (e.dead) return;
        const overlap = player.x + player.w > e.x - 10 && player.x < e.x + 10 &&
                        player.y + player.h > e.y - 10 && player.y < e.y + 10;

        if (!overlap) return;

        if (player.vy > 0 && player.y + player.h <= e.y + 6) {
          e.dead = true;
          player.vy = player.jump * 0.85;
          score += 40 * (1 + combo * 0.1);
          combo++;
          particlesAt(e.x, e.y, 15, '#ff9cb3');
          return;
        }

        // take hit
        if (!player.bonus) {
          if (player.shield) {
            player.shield = false;
            player.shieldTimer = 0;
            e.dead = true;
            player.vy = player.jump * 0.9;
            particlesAt(e.x, e.y, 22, '#3b82f6');
          } else {
            gameOver();
            return;
          }
        }
      });

      if (player.y > H + 50) gameOver();

      const minY = Math.min(...platforms.map(p => p.y));
      if (minY > -H) addPlatform(50 + Math.random() * (W - 150), minY - 65 - Math.random() * 20);

      platforms = platforms.filter(p => p.y < H + 80 && p.type !== 'deleted');
      enemies = enemies.filter(e => e.y < H + 80 && !e.dead);
      coins = coins.filter(c => c.y < H + 80 && !c.collected);
      bonuses = bonuses.filter(b => b.y < H + 80 && !b.collected);

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (combo > 0 && Math.random() < 0.01) combo--;

      updateUI();
      els.score.textContent = Math.floor(score);
    }

    function updateUI() {
      els.combo.textContent = `x${combo + 1}`;

      if (player.bonus) {
        els.bonus.textContent = `${Math.ceil(player.timer / 1000)}s`;
      } else if (player.shield) {
        els.bonus.textContent = `SHIELD ${Math.ceil(player.shieldTimer / 1000)}s`;
      } else {
        els.bonus.textContent = 'IDLE';
      }

      els.bonus.classList.toggle('bonus-active', player.bonus);
      els.bonus.classList.toggle('shield-active', player.shield && !player.bonus);

      if (score > best) {
        best = score;
        localStorage.gradJumpBest = Math.floor(best);
        els.bestNote.textContent = 'NEW BEST!';
        els.bestNote.classList.add('new');
        els.bestScore.textContent = Math.floor(score);
      }
    }

    function drawBg() {
      bgCtx.fillStyle = '#010209';
      bgCtx.fillRect(0, 0, W, H);

      let parallax = scroll * 0.3;
      let grad = bgCtx.createLinearGradient(0, H, 0, H / 2);
      grad.addColorStop(0, 'rgba(10,20,35,0.5)');
      grad.addColorStop(1, 'rgba(3,8,18,0.2)');

      bgCtx.fillStyle = grad;
      bgCtx.beginPath();
      bgCtx.moveTo(0, H);
      for (let x = 0; x <= W; x += 30) {
        bgCtx.lineTo(x, H / 3 + Math.sin(x * 0.01 + parallax * 0.01) * 40);
      }
      bgCtx.lineTo(W, H);
      bgCtx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      ctx.shadowBlur = player.bonus ? 20 : 10;
      ctx.shadowColor = player.bonus ? '#ffeb3b' : '#00ff9c';

      platforms.forEach(p => {
        if (p.type === 'deleted') return;

        if (p.type === 'super') {
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 4;
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 20;
        } else if (p.type === 'break') {
          let alpha = p.breaking ? 1 - (p.breakTime || 0) / 1200 : 1;
          ctx.strokeStyle = `rgba(255,75,106,${alpha})`;
          ctx.lineWidth = 3;
          ctx.shadowColor = '#ff4b6a';
          ctx.shadowBlur = p.breaking ? 15 : 8;
        } else if (p.type === 'moving') {
          ctx.strokeStyle = '#3b82f6';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#3b82f6';
          ctx.shadowBlur = 12;
        } else if (p.type === 'base') {
          ctx.strokeStyle = '#00ff9c';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#00ff9c';
          ctx.shadowBlur = 5;
        } else {
          ctx.strokeStyle = '#00c27a';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#00c27a';
          ctx.shadowBlur = 8;
        }

        ctx.strokeRect(p.x, p.y, p.w, p.h);
      });

      ctx.shadowBlur = 15;
      ctx.font = 'bold 18px Orbitron';
      coins.forEach(c => {
        if (c.collected) return;
        ctx.shadowColor = ctx.fillStyle = '#00ff9c';
        ctx.fillText('+', c.x - 2, c.y + 5);
      });

      ctx.shadowBlur = 20;
      ctx.font = 'bold 20px Orbitron';
      bonuses.forEach(b => {
        if (b.collected) return;
        if (b.type === 'shield') {
          ctx.shadowColor = ctx.fillStyle = '#3b82f6';
          ctx.fillText('O', b.x - 4, b.y + 6);
        } else {
          ctx.shadowColor = ctx.fillStyle = '#ffeb3b';
          ctx.fillText('^', b.x - 4, b.y + 6);
        }
      });

      ctx.shadowBlur = 12;
      ctx.shadowColor = ctx.fillStyle = '#ff4b6a';
      ctx.font = '18px Orbitron';
      enemies.forEach(e => {
        if (e.dead) return;
        ctx.fillText('-', e.x - 5, e.y + 5);
      });

      ctx.font = '16px Orbitron';
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.shadowBlur = 8;
        ctx.shadowColor = ctx.fillStyle = p.col;
        ctx.fillText('./', p.x - 4, p.y + 5);
        ctx.restore();
      });

      ctx.shadowBlur = player.bonus ? 25 : 18;
      ctx.shadowColor = player.bonus ? '#ffeb3b' : '#e5fdf6';
      ctx.fillStyle = player.bonus ? '#fff' : '#e5fdf6';
      ctx.font = 'bold 20px Orbitron';
      ctx.fillText('./', player.x, player.y + 14);

      if (player.shield) {
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#3b82f6';
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x + 10, player.y + 10, 16, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    function gameOver() {
      if (state === 'over') return;
      state = 'over';
      els.finalScore.textContent = Math.floor(score);
      if (score > parseInt(localStorage.gradJumpBest || 0)) els.newBest.style.display = 'block';
      els.gameOver.classList.add('visible');
    }

    let lastTime = 0;
    function loop(time) {
      let dt = time - lastTime;
      lastTime = time;

      drawBg();
      if (state === 'running') update(dt);
      draw();

      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.code === 'Space' && state !== 'running') reset();
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    els.startBtn.onclick = els.restartBtn.onclick = els.playAgain.onclick = reset;
    requestAnimationFrame(loop);
  </script>
</body>
</html>
