<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>./ GRAD JUMP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

    :root{
      --bg:#000;
      --accent:#00ff9c;
      --accent-soft:#00c27a;
      --danger:#ff4b6a;
      --bonus:#ffeb3b;
      --superjump:#ffd700;
      --shield:#3b82f6;
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      height:100vh;background:var(--bg);
      font-family:'Orbitron', monospace;color:#e0e7ff;overflow:hidden;
      display:flex;justify-content:center;align-items:center;padding:20px;
    }

    .container{
      width:min(900px,98vw);height:90vh;
      background:rgba(10,14,26,0.9);
      border-radius:16px;border:1px solid rgba(0,255,156,0.2);
      display:flex;flex-direction:column;gap:16px;
      padding:24px;box-shadow:0 0 40px rgba(0,255,156,0.1);
    }

    .title{
      font-size:clamp(28px,6vw,40px);font-weight:900;
      background:linear-gradient(90deg,var(--accent),#ffeb3b);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      text-align:center;letter-spacing:0.05em;
    }

    .hud{
      display:flex;justify-content:space-around;gap:20px;
      padding:12px;background:rgba(0,30,20,0.4);
      border-radius:8px;border:1px solid rgba(0,255,156,0.3);
      flex-wrap:wrap;
    }

    .hud-item{text-align:center;min-width:110px;}
    .hud-label{font-size:10px;opacity:0.7;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.1em;}
    .hud-value{font-size:18px;font-weight:700;color:var(--accent);}

    .combo{color:var(--accent-soft);animation:pulse 1s infinite;}
    .bonus-active{color:var(--bonus);animation:bonusPulse 0.8s infinite;text-shadow:0 0 10px var(--bonus);}
    .shield-active{color:var(--shield);animation:bonusPulse 0.8s infinite;text-shadow:0 0 10px var(--shield);}
    .mode-val{color:#c7d2fe;text-shadow:0 0 10px rgba(199,210,254,0.15);}

    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
    @keyframes bonusPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

    .canvas-container{
      flex:1;position:relative;border-radius:12px;overflow:hidden;
      border:1px solid rgba(0,255,156,0.2);
      background:radial-gradient(circle at 50% 90%, #020306 0%, #000 100%);
    }
    canvas{width:100%;height:100%;display:block;}
    #bgCanvas{position:absolute;opacity:0.2;pointer-events:none;}

    .bottom{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#94a3b8;}
    .best-score{
      padding:8px 16px;background:rgba(0,30,20,0.5);
      border-radius:6px;border:1px solid rgba(0,255,156,0.2);
    }
    .best-score.new{
      color:var(--accent);background:rgba(0,255,156,0.15);
      box-shadow:0 0 15px rgba(0,255,156,0.3);
    }

    .controls{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;}
    .btn{
      font-family:'Orbitron', monospace;font-weight:700;font-size:14px;
      padding:12px 20px;border:2px solid var(--accent);
      background:transparent;color:var(--accent);
      border-radius:8px;cursor:pointer;transition:all 0.2s ease;text-transform:uppercase;
    }
    .btn:hover{
      background:rgba(0,255,156,0.1);box-shadow:0 0 20px rgba(0,255,156,0.4);
      transform:translateY(-2px);
    }
    .btn.secondary{border-color:rgba(0,255,156,0.35);color:#a7f3d0;}
    .btn.active{background:rgba(0,255,156,0.12);box-shadow:0 0 22px rgba(0,255,156,0.35);}
    .hint{ text-align:center;font-size:11px;color:#94a3b8;margin-top:4px; }

    .overlay{
      position:fixed;inset:0;background:rgba(0,0,0,0.95);
      display:none;justify-content:center;align-items:center;z-index:1000;
    }
    .overlay.visible{display:flex;}
    .overlay-panel{
      background:rgba(10,14,26,0.95);
      border:2px solid var(--accent);border-radius:16px;
      padding:32px 24px;text-align:center;max-width:90vw;
    }
    .overlay-title{
      font-size:clamp(24px,8vw,32px);font-weight:900;color:var(--accent);
      margin-bottom:10px;text-shadow:0 0 15px var(--accent);
    }
    .overlay-sub{
      font-size:12px;color:#94a3b8;margin-bottom:16px;
    }
    .overlay-score{font-size:20px;color:var(--accent-soft);font-weight:700;margin-bottom:12px;}
    .overlay-best{font-size:16px;color:var(--accent);font-weight:900;margin-bottom:20px;display:none;}

    @media (max-width:768px){
      .container{padding:16px;gap:12px;}
      .hud{gap:8px;}
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">./ GRAD JUMP</h1>

    <div class="hud">
      <div class="hud-item">
        <div class="hud-label">MODE</div>
        <span class="hud-value mode-val" id="modeLabel">./ CLASSIC</span>
      </div>
      <div class="hud-item">
        <div class="hud-label">SCORE</div>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-item">
        <div class="hud-label">BEST</div>
        <span class="hud-value" id="bestScore">0</span>
      </div>
      <div class="hud-item">
        <div class="hud-label">COMBO</div>
        <span class="hud-value combo" id="combo">x1</span>
      </div>
      <div class="hud-item">
        <div class="hud-label">BONUS</div>
        <span class="hud-value" id="bonus">IDLE</span>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="bgCanvas" width="900" height="500"></canvas>
      <canvas id="gameCanvas" width="900" height="500"></canvas>
    </div>

    <div class="bottom">
      <div>move ← → / A D ...</div>
      <div class="best-score" id="bestNote">jump sir...</div>
    </div>

    <div class="controls">
      <button class="btn secondary active" id="modeClassic">./ CLASSIC</button>
      <button class="btn secondary" id="modeJump">./ JUMP MODE</button>
      <button class="btn secondary" id="modeHard">./ HARD MODE</button>
      <button class="btn" id="startBtn">START</button>
      <button class="btn" id="restartBtn" style="display:none">RESTART</button>
    </div>
    <div class="hint">Space = start/restart. Side contact or fall = death.</div>

    <div class="overlay" id="gameOver">
      <div class="overlay-panel">
        <div class="overlay-title">GAME OVER</div>
        <div class="overlay-sub" id="overMode">./ CLASSIC</div>
        <div class="overlay-score">Score: <span id="finalScore">0</span></div>
        <div class="overlay-best" id="newBest">NEW BEST!</div>
        <button class="btn" id="playAgain">RESTART</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const bgCanvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    const bgCtx = bgCanvas.getContext('2d');

    const W = 900, H = 500;
    canvas.width = bgCanvas.width = W;
    canvas.height = bgCanvas.height = H;

    const els = {
      score: document.getElementById('score'),
      bestScore: document.getElementById('bestScore'),
      combo: document.getElementById('combo'),
      bonus: document.getElementById('bonus'),
      bestNote: document.getElementById('bestNote'),
      startBtn: document.getElementById('startBtn'),
      restartBtn: document.getElementById('restartBtn'),
      gameOver: document.getElementById('gameOver'),
      finalScore: document.getElementById('finalScore'),
      newBest: document.getElementById('newBest'),
      playAgain: document.getElementById('playAgain'),
      modeLabel: document.getElementById('modeLabel'),
      overMode: document.getElementById('overMode'),
      modeClassic: document.getElementById('modeClassic'),
      modeJump: document.getElementById('modeJump'),
      modeHard: document.getElementById('modeHard')
    };

    const THRESHOLD = H * 0.40;

    const BONUS_TIME = 3000;
    const SHIELD_TIME = 5000;

    const JUMP_FORCE_NORMAL = -12;
    const JUMP_FORCE_SUPER_MULT = 2.0;

    const MOVING_PLATFORM_CHANCE = 0.18; 
    const ENEMY_SPAWN_CHANCE = 0.25;

    const BREAK_LIFETIME_CLASSIC = 1200;
    const BREAK_LIFETIME_HARD = 650;

    const MODES = {
      classic: { id: 'classic', label: './ CLASSIC' },
      jump:    { id: 'jump',    label: './ JUMP MODE' },
      hard:    { id: 'hard',    label: './ HARD MODE' }
    };

    let mode = MODES.classic;

    function bestKeyForMode(m) {
      return `gradJumpBest_${m.id}`;
    }

    function loadBest(m) {
      const raw = localStorage.getItem(bestKeyForMode(m));
      const val = raw ? parseInt(raw, 10) : 0;
      return Number.isFinite(val) ? val : 0;
    }

    function saveBest(m, v) {
      localStorage.setItem(bestKeyForMode(m), String(Math.floor(v)));
    }

    function setMode(m) {
      mode = m;
      els.modeLabel.textContent = m.label;
      els.overMode.textContent = m.label;

      els.modeClassic.classList.toggle('active', m.id === 'classic');
      els.modeJump.classList.toggle('active', m.id === 'jump');
      els.modeHard.classList.toggle('active', m.id === 'hard');

      best = loadBest(m);
      els.bestScore.textContent = best;
      els.bestNote.textContent = 'ready...';
      els.bestNote.classList.remove('new');

      if (state === 'running') gameOver();
      updateUI();
    }

    let keys = {};
    let state = 'idle'; 
    let scroll = 0;

    let score = 0;
    let combo = 0;
    let lastBonusBucket = 0;
    let best = loadBest(mode);

    let player = makePlayer();

    let platforms = [];
    let enemies = [];
    let coins = [];
    let bonuses = [];
    let particles = [];

    function makePlayer() {
      return {
        x: 450, y: 350, w: 24, h: 20,
        vx: 0, vy: 0,
        speed: 3.5,
        jump: JUMP_FORCE_NORMAL,
        g: 0.35,
        bonus: false,
        timer: 0,
        shield: false,
        shieldTimer: 0,
        onGround: false
      };
    }

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function particlesAt(x, y, count = 8, col = '#00ff9c') {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6 - 1,
          life: 40, maxLife: 40,
          col,
          size: 0.8 + Math.random() * 0.4
        });
      }
    }

    function superJumpEffect(x, y) {
      for (let i = 0; i < 25; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12 - 3,
          life: 60, maxLife: 60,
          col: '#ffd700',
          size: 1.0
        });
      }
    }

    function makePlatform(x, y, type) {
      const w = 100 + Math.random() * 60;
      const p = { x, y, w, h: 12, type, breaking: false, breakTime: 0 };

      if (type === 'moving') {
        p.baseX = x;
        p.dir = Math.random() < 0.5 ? -1 : 1;
        p.range = 40 + Math.random() * 50;
        p.speed = 1.0 + Math.random() * 0.8;
      }
      return p;
    }

    function choosePlatformTypeForMode() {
      if (mode.id === 'jump') return 'super'; 
      if (mode.id === 'hard') return 'break'; 
      const r = Math.random();
      return r < 0.15 ? 'super'
           : r < 0.35 ? 'break'
           : r < (0.35 + MOVING_PLATFORM_CHANCE) ? 'moving'
           : 'normal';
    }

    function breakLifetimeForMode() {
      return mode.id === 'hard' ? BREAK_LIFETIME_HARD : BREAK_LIFETIME_CLASSIC;
    }

    function bonusesEnabled() {
      return mode.id === 'classic';
    }

    function spawnCoinsEnabled() {
      return true;
    }

    function addPlatform(x, y) {
      const type = choosePlatformTypeForMode();
      const p = makePlatform(x, y, type);
      platforms.push(p);

      if (spawnCoinsEnabled() && Math.random() < 0.40) {
        coins.push({ x: x + p.w / 2 - 4, y: y - 18, collected: false });
      }

      if (bonusesEnabled()) {
        const bucket = Math.floor(score / 100);
        if (bucket > lastBonusBucket && Math.random() < 0.25) {
          bonuses.push({
            x: x + p.w / 2 - 4,
            y: y - 26,
            type: Math.random() < 0.5 ? 'flight' : 'shield',
            collected: false
          });
          lastBonusBucket = bucket;
        }
      }

      if (y < H - 120 && Math.random() < ENEMY_SPAWN_CHANCE) {
        enemies.push({
          x: x + p.w / 2,
          y: y - 12,
          dir: Math.random() < 0.5 ? -1 : 1,
          speed: 0.8 + Math.random() * 0.4,
          range: 30 + Math.random() * 20,
          baseX: x + p.w / 2,
          dead: false
        });
      }
    }

    function reset() {
      player = makePlayer();

      platforms = [ { x: 400, y: H - 30, w: 120, h: 12, type: 'base', breaking: false, breakTime: 0 } ];
      enemies = [];
      coins = [];
      bonuses = [];
      particles = [];

      score = 0;
      combo = 0;
      lastBonusBucket = 0;
      scroll = 0;

      state = 'running';

      for (let i = 0; i < 12; i++) {
        const x = 50 + Math.random() * (W - 150);
        const y = H - 60 - i * 55;
        const type = choosePlatformTypeForMode();
        platforms.push(makePlatform(x, y, type));
      }

      els.gameOver.classList.remove('visible');
      els.newBest.style.display = 'none';
      els.restartBtn.style.display = 'inline-flex';
      els.startBtn.style.display = 'none';

      updateUI();
    }

    function update(dt) {
      if (state !== 'running') return;

      if (player.shield) {
        player.shieldTimer -= dt;
        if (player.shieldTimer <= 0) {
          player.shield = false;
          player.shieldTimer = 0;
          particlesAt(player.x + 12, player.y, 14, '#3b82f6');
        }
      }

      if (player.bonus) {
        player.timer -= dt;
        player.vy = -8.5;
        player.vx = (keys.ArrowLeft || keys.a || keys.A ? -player.speed * 1.2 :
                    keys.ArrowRight || keys.d || keys.D ?  player.speed * 1.2 : player.vx * 0.92);

        if (player.timer <= 0) {
          player.bonus = false;
          particlesAt(player.x + 12, player.y, 20, '#ffeb3b');
        }
      } else {
        player.vx = (keys.ArrowLeft || keys.a || keys.A ? -player.speed :
                    keys.ArrowRight || keys.d || keys.D ?  player.speed : player.vx * 0.85);
        player.vy += player.g;
      }

      player.x += player.vx;
      player.y += player.vy;

      if (player.x + player.w < 0) player.x = W;
      if (player.x > W) player.x = -player.w;

      for (const p of platforms) {
        if (p.type !== 'moving') continue;
        p.x += p.dir * p.speed * (dt / 16);
        if (Math.abs(p.x - p.baseX) > p.range) p.dir *= -1;
      }

      player.onGround = false;
      if (player.vy > 0 && !player.bonus) {
        for (const p of platforms) {
          if (p.type === 'deleted') continue;

          const hit =
            player.x + player.w > p.x &&
            player.x < p.x + p.w &&
            player.y + player.h > p.y &&
            player.y + player.h < p.y + 16;

          if (!hit) continue;

          player.y = p.y - player.h;

          const isSuper = (p.type === 'super') || (mode.id === 'jump' && p.type !== 'base');
          player.vy = isSuper ? player.jump * JUMP_FORCE_SUPER_MULT : player.jump;

          player.onGround = true;

          if (p.type === 'break') {
            if (!p.breaking) {
              p.breaking = true;
              particlesAt(p.x + p.w / 2, p.y + p.h, 12, '#ff9cb3');
            }
          }

          if (p.type === 'super') {
            superJumpEffect(p.x + p.w / 2, p.y + p.h);
            score += 50;
            combo++;
          }

          if (mode.id === 'jump' && p.type !== 'base') {
            superJumpEffect(p.x + p.w / 2, p.y + p.h);
            score += 20;
            combo++;
          }

          if (mode.id === 'hard' && p.type === 'break') {
            score += 10;
            combo++;
          }

          break;
        }
      }

      if (player.y < THRESHOLD) {
        const diff = THRESHOLD - player.y;
        player.y = THRESHOLD;
        scroll += diff;

        score += diff * 0.06;

        for (const p of platforms) p.y += diff;
        for (const e of enemies) e.y += diff;
        for (const c of coins) c.y += diff;
        for (const b of bonuses) b.y += diff;
      }

      for (const e of enemies) {
        if (e.dead) continue;
        e.x += e.dir * e.speed * (dt / 16);
        if (Math.abs(e.x - e.baseX) > e.range) e.dir *= -1;
      }

      const breakLife = breakLifetimeForMode();
      for (const p of platforms) {
        if (p.type !== 'break' || !p.breaking) continue;
        p.breakTime = (p.breakTime || 0) + dt;
        if (p.breakTime > breakLife) {
          p.type = 'deleted';
          particlesAt(p.x + p.w / 2, p.y + p.h, 8, '#ff4b6a');
        }
      }

      for (const c of coins) {
        if (c.collected) continue;
        const overlap =
          player.x < c.x + 10 &&
          player.x + player.w > c.x &&
          player.y < c.y + 10 &&
          player.y + player.h > c.y;

        if (!overlap) continue;

        c.collected = true;
        score += 25 * (1 + combo * 0.1);
        combo++;
        particlesAt(c.x, c.y);
      }

      if (bonusesEnabled()) {
        for (const b of bonuses) {
          if (b.collected) continue;
          const overlap =
            player.x < b.x + 12 &&
            player.x + player.w > b.x &&
            player.y < b.y + 12 &&
            player.y + player.h > b.y;

          if (!overlap) continue;

          b.collected = true;

          if (b.type === 'shield') {
            player.shield = true;
            player.shieldTimer = SHIELD_TIME;
            score += 80;
            combo++;
            particlesAt(b.x, b.y, 22, '#3b82f6');
          } else {
            player.bonus = true;
            player.timer = BONUS_TIME;
            score += 100;
            combo += 2;
            particlesAt(b.x, b.y, 20, '#ffeb3b');
          }
        }
      }

      for (const e of enemies) {
        if (e.dead) continue;

        const overlap =
          player.x + player.w > e.x - 10 &&
          player.x < e.x + 10 &&
          player.y + player.h > e.y - 10 &&
          player.y < e.y + 10;

        if (!overlap) continue;

        if (player.vy > 0 && player.y + player.h <= e.y + 6) {
          e.dead = true;
          player.vy = player.jump * 0.85;
          score += 40 * (1 + combo * 0.1);
          combo++;
          particlesAt(e.x, e.y, 15, '#ff9cb3');
          continue;
        }

        // hit
        if (!player.bonus) {
          if (player.shield) {
            player.shield = false;
            player.shieldTimer = 0;
            e.dead = true;
            player.vy = player.jump * 0.9;
            particlesAt(e.x, e.y, 22, '#3b82f6');
          } else {
            gameOver();
            return;
          }
        }
      }

      if (player.y > H + 50) {
        gameOver();
        return;
      }

      const minY = Math.min(...platforms.map(p => p.y));
      if (minY > -H) {
        addPlatform(50 + Math.random() * (W - 150), minY - 65 - Math.random() * 20);
      }

      platforms = platforms.filter(p => p.y < H + 80 && p.type !== 'deleted');
      enemies = enemies.filter(e => e.y < H + 80 && !e.dead);
      coins = coins.filter(c => c.y < H + 80 && !c.collected);
      bonuses = bonuses.filter(b => b.y < H + 80 && !b.collected);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (combo > 0 && Math.random() < 0.01) combo--;

      updateUI();
      els.score.textContent = Math.floor(score);
    }

    function updateUI() {
      els.combo.textContent = `x${combo + 1}`;

      if (!bonusesEnabled()) {
        els.bonus.textContent = 'OFF';
      } else if (player.bonus) {
        els.bonus.textContent = `${Math.ceil(player.timer / 1000)}s`;
      } else if (player.shield) {
        els.bonus.textContent = `SHIELD ${Math.ceil(player.shieldTimer / 1000)}s`;
      } else {
        els.bonus.textContent = 'IDLE';
      }

      els.bonus.classList.toggle('bonus-active', player.bonus && bonusesEnabled());
      els.bonus.classList.toggle('shield-active', player.shield && !player.bonus && bonusesEnabled());

      if (score > best) {
        best = score;
        saveBest(mode, best);
        els.bestNote.textContent = 'NEW BEST!';
        els.bestNote.classList.add('new');
        els.bestScore.textContent = Math.floor(best);
      } else {
        els.bestScore.textContent = Math.floor(best);
      }
    }

    function drawBg() {
      bgCtx.fillStyle = '#010209';
      bgCtx.fillRect(0, 0, W, H);

      const parallax = scroll * 0.3;
      const grad = bgCtx.createLinearGradient(0, H, 0, H / 2);
      grad.addColorStop(0, 'rgba(10,20,35,0.5)');
      grad.addColorStop(1, 'rgba(3,8,18,0.2)');

      bgCtx.fillStyle = grad;
      bgCtx.beginPath();
      bgCtx.moveTo(0, H);
      for (let x = 0; x <= W; x += 30) {
        bgCtx.lineTo(x, H / 3 + Math.sin(x * 0.01 + parallax * 0.01) * 40);
      }
      bgCtx.lineTo(W, H);
      bgCtx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      for (const p of platforms) {
        if (p.type === 'deleted') continue;

        if (p.type === 'super') {
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 4;
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 20;
        } else if (p.type === 'break') {
          const alpha = p.breaking ? 1 - (p.breakTime || 0) / breakLifetimeForMode() : 1;
          ctx.strokeStyle = `rgba(255,75,106,${clamp(alpha, 0, 1)})`;
          ctx.lineWidth = 3;
          ctx.shadowColor = '#ff4b6a';
          ctx.shadowBlur = p.breaking ? 15 : 8;
        } else if (p.type === 'moving') {
          ctx.strokeStyle = '#3b82f6';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#3b82f6';
          ctx.shadowBlur = 12;
        } else if (p.type === 'base') {
          ctx.strokeStyle = '#00ff9c';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#00ff9c';
          ctx.shadowBlur = 5;
        } else {
          ctx.strokeStyle = '#00c27a';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#00c27a';
          ctx.shadowBlur = 8;
        }

        ctx.strokeRect(p.x, p.y, p.w, p.h);
      }

      ctx.shadowBlur = 15;
      ctx.font = 'bold 18px Orbitron';
      for (const c of coins) {
        if (c.collected) continue;
        ctx.shadowColor = ctx.fillStyle = '#00ff9c';
        ctx.fillText('+', c.x - 2, c.y + 5);
      }

      // Bonuses (classic only)
      if (bonusesEnabled()) {
        ctx.shadowBlur = 20;
        ctx.font = 'bold 20px Orbitron';
        for (const b of bonuses) {
          if (b.collected) continue;
          if (b.type === 'shield') {
            ctx.shadowColor = ctx.fillStyle = '#3b82f6';
            ctx.fillText('O', b.x - 4, b.y + 6);
          } else {
            ctx.shadowColor = ctx.fillStyle = '#ffeb3b';
            ctx.fillText('^', b.x - 4, b.y + 6);
          }
        }
      }

      // Enemies
      ctx.shadowBlur = 12;
      ctx.shadowColor = ctx.fillStyle = '#ff4b6a';
      ctx.font = '18px Orbitron';
      for (const e of enemies) {
        if (e.dead) continue;
        ctx.fillText('-', e.x - 5, e.y + 5);
      }

      // Particles
      ctx.font = '16px Orbitron';
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.shadowBlur = 8;
        ctx.shadowColor = ctx.fillStyle = p.col;
        ctx.fillText('./', p.x - 4, p.y + 5);
        ctx.restore();
      }

      // Player
      ctx.shadowBlur = player.bonus ? 25 : 18;
      ctx.shadowColor = player.bonus ? '#ffeb3b' : '#e5fdf6';
      ctx.fillStyle = player.bonus ? '#fff' : '#e5fdf6';
      ctx.font = 'bold 20px Orbitron';
      ctx.fillText('./', player.x, player.y + 14);

      if (player.shield && bonusesEnabled()) {
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#3b82f6';
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x + 10, player.y + 10, 16, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    function gameOver() {
      if (state === 'over') return;
      state = 'over';

      els.finalScore.textContent = Math.floor(score);
      els.gameOver.classList.add('visible');

      const storedBest = loadBest(mode);
      if (Math.floor(score) >= storedBest) {
        els.newBest.style.display = 'block';
      } else {
        els.newBest.style.display = 'none';
      }
    }


    let lastTime = 0;
    function loop(time) {
      const dt = time - lastTime;
      lastTime = time;

      drawBg();
      if (state === 'running') update(dt);
      draw();

      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.code === 'Space' && state !== 'running') reset();
    });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    els.startBtn.onclick = () => reset();
    els.restartBtn.onclick = () => reset();
    els.playAgain.onclick = () => reset();

    els.modeClassic.onclick = () => setMode(MODES.classic);
    els.modeJump.onclick = () => setMode(MODES.jump);
    els.modeHard.onclick = () => setMode(MODES.hard);

    els.bestScore.textContent = best;
    setMode(MODES.classic);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
